[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-framework"
version = "0.1.0"
description = "Engineering framework for embedded control systems and graphical HMIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
ai = ["anthropic>=1.9", "openai>=3.20"]
dev = ["pytest>=8", "ruff>=0.6", "clang-format==23.1.1", "Pillow>=10"]

[project.scripts]
sparrow = "sparrow.cli:main"

[tool.setuptools]
packages = [
    "sparrow",
    "sparrow.codegen",
    "sparrow.requirements",
    "sparrow.simulation",
    "sparrow.ai",
    "sparrow.ai.providers",
    "smart_boiler",
]

[tool.setuptools.package-dir]
smart_boiler = "examples/smart-boiler/smart_boiler"

[tool.pytest.ini_options]
testpaths = ["tests/python", "examples/smart-boiler/tests/python"]
addopts = "-ra --strict-markers"
markers = ["verifies(*requirements): the test verifies the listed requirement IDs"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/smart-boiler/smart_boiler/model.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
