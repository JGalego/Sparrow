# Example configuration for `sparrow ai`. Copy it to sparrow-ai.local.yaml
# (ignored by Git) or ~/.config/sparrow/ai.yaml and keep the profiles you use.
# Credentials come from the environment variable named by api_key_env.
default: claude

profiles:
  claude:
    provider: anthropic
    model: claude-opus-5-5
    api_key_env: ANTHROPIC_API_KEY
    effort: high            # low | medium | high | xhigh | max

  openai:
    provider: openai
    model: <openai-model-id>
    api_key_env: OPENAI_API_KEY

  ollama:                   # local server, no key
    provider: openai-compatible
    base_url: http://localhost:11434/v1
    model: qwen2.5-coder:32b
    structured_output: json_schema
    temperature: 0
    timeout_s: 1800

  groq:
    provider: openai-compatible
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model: <groq-model-id>
    structured_output: json_object
