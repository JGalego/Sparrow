name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cppcheck libsdl2-dev
          python -m pip install -e '.[dev]'
      - name: Build and test
        run: make test PRESET=host-headless
      - name: C tests with sanitizers
        run: make test-asan

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          python -m pip install -e '.[dev]'
      - name: Lint
        run: make lint
