name: approach
description: >
  Stabilized approach from 1000 ft at 150 kt with the gear up. The crew
  selects the gear down at 900 ft and lands with three green.
duration_s: 75
plant:
  initial_altitude_ft: 1000.0
  initial_airspeed_kt: 150.0
  vertical_speed_fpm: -900.0
  gear_down: false
events:
  - {at_s: 7, action: command, fields: {gear_handle_down: 1}}
  - {at_s: 67, action: command, fields: {acceleration_kt_per_s: -4.0}}
