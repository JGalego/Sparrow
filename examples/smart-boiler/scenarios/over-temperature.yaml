name: over-temperature
description: >
  The heater relay welds shut while the boiler runs. The controller warns at
  100 degC and trips at 110 degC, opening the contactor.
plant:
  initial_temperature_c: 96.0
events:
  - {at_s: 2, action: command, fields: {start: 1}}
  - {at_s: 15, action: inject, fault: HEATER_SSR_SHORTED}
